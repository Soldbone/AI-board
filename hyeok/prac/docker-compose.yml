services:
  postgres:
    image: postgres:16
    container_name: prac_postgres
    environment:
      POSTGRES_USER: prac_user
      POSTGRES_PASSWORD: prac_password
      POSTGRES_DB: prac_board
    ports:
      - "5432:5432"
    volumes:
      - prac_postgres_data:/var/lib/postgresql/data

volumes:
  prac_postgres_data:

