services:
  db:
    image: pgvector/pgvector:pg16
    container_name: potato-maker-db
    environment:
      POSTGRES_DB: potato_maker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - potato_maker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d potato_maker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  potato_maker_pgdata:
